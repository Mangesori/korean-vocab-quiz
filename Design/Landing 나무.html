<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>나무 · 랜딩 시안 3종</title>

<!-- Fonts -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'Paperozi';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
  font-weight:700;font-display:swap;
}
@font-face{
  font-family:'Paperozi';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
  font-weight:800;font-display:swap;
}

html,body{margin:0;padding:0;background:#f0eee9;font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable',sans-serif}
*{box-sizing:border-box}
a{color:inherit}
</style>
</head>
<body>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Design canvas + shared + 3 시안 -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="landing-shared.jsx"></script>
<script type="text/babel" src="landing-a.jsx"></script>
<script type="text/babel" src="landing-b.jsx"></script>
<script type="text/babel" src="landing-c.jsx"></script>

<script type="text/babel">
const W = 1280; // 데스크탑 랜딩 폭
const HA = 2380, HB = 2180, HC = 2980; // 시안별 예상 높이

const App = () => (
  <DesignCanvas>
    <DCSection
      id="landing-namu"
      title="나무 — 랜딩 페이지 시안"
      subtitle="달콤한 한국어 → 나무 리브랜딩. 3가지 방향. 기존 구조 보존 / 도구 강조 / 메타포 시각화. 카드 우측 상단 확장 버튼으로 풀스크린."
    >
      <DCArtboard id="a" label="A · 구조 보존 리스킨" width={W} height={HA}>
        <LandingA />
      </DCArtboard>
      <DCArtboard id="b" label="B · 도구 강조 (split hero)" width={W} height={HB}>
        <LandingB />
      </DCArtboard>
      <DCArtboard id="c" label="C · 메타포 시각화" width={W} height={HC}>
        <LandingC />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
